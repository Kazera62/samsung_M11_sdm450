name: NOCTURNE // SDM450 Kernel Build
run-name: "NOCTURNE | ${{ inputs.clang_profile }} | Root: ${{ inputs.kernelsu_fork }} | SUSFS: ${{ inputs.susfs_enable }} | Telegram: ${{ inputs.telegram_delivery }}"

on:
  workflow_dispatch:
    inputs:
      clang_profile:
        description: "Select the Clang toolchain"
        required: true
        type: choice
        default: lineage-r416183b
        options:
          - lineage-r416183b
          - proton-clang
      kernelsu_fork:
        description: "Root implementation; with SUSFS enabled, use bakasu or sukisu"
        required: true
        type: choice
        default: bakasu
        options:
          - bakasu
          - sukisu
          - next
          - rsuntk
          - xxksu
      kernelsu_method:
        description: "How the upstream builder integrates KernelSU"
        required: true
        type: choice
        default: shell
        options:
          - shell
          - manual
          - only
      susfs_enable:
        description: "Enable SUSFS integration and patching"
        required: true
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
      patch_diagnostics:
        description: "Collect rejected SUSFS hunks and stop on conflicts"
        required: true
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
      skip_patch:
        description: "Allow compilation to continue even when the SUSFS patch has rejected hunks"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
      rekernel_enable:
        description: "Apply optional Re:Kernel patches (may require cgroup support)"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
      droidspaces_enable:
        description: "Apply optional Droidspaces patches; upstream warns they may conflict with SUSFS"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
      nomount_enable:
        description: "Apply optional NoMount patches"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
      hook_method:
        description: "KernelSU hook method used by the upstream integration"
        required: true
        type: choice
        default: syscall
        options:
          - syscall
          - manual
      kpm_enable:
        description: "Enable KPM support where supported by the selected root implementation"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
      kpm_inline:
        description: "Enable inline KPM; requires KPM enabled and SukiSU-Ultra selected"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
      kpm_kpatch_next:
        description: "Apply the optional KPatch-Next hook; requires KPM enabled"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
      baseband_guard_enable:
        description: "Apply the optional Baseband Guard patch"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
      baseband_guard_boot:
        description: "Enable Baseband Guard protection for the boot partition; requires Baseband Guard"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
      generate_dtb:
        description: "Generate a standalone DTB from DTS files if needed; normally leave disabled for this device"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
      need_dtbo:
        description: "Include a built DTBO image in AnyKernel3 when the build produces one"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
      need_safe_dtbo:
        description: "Enable the upstream safe-DTBO option when applicable"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
      pack_kmodules:
        description: "Package compiled .ko modules in the AnyKernel3 ZIP"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - enabled
      merge_config_files:
        description: "Optional comma-separated config filenames relative to arch/arm64/configs; leave blank to disable"
        required: false
        type: string
        default: ""
      free_more_space:
        description: "Enable upstream build workspace cleanup to free disk space"
        required: true
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
      telegram_delivery:
        description: "Send the completed AnyKernel3 ZIP to Telegram"
        required: true
        type: choice
        default: send
        options:
          - send
          - skip

permissions:
  contents: read

concurrency:
  group: nocturne-build-${{ github.ref }}
  cancel-in-progress: true

# Latest upstream NonGKI build framework is checked out for each run.
# Kernel source is built from the branch selected in the Actions UI.
env:
  DEVICE_NAME: "samsung_m11"
  DEVICE_CODENAME: "m11q"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib64 DTC_EXT=$GITHUB_WORKSPACE/device_kernel/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y"

  KERNEL_SOURCE: "https://github.com/Kazera62/samsung_M11_sdm450.git"
  KERNEL_BRANCH: "${{ github.ref_name }}"

  # Known reference toolchain for this Linux 4.9 family.
  # The alternative is available as a selectable experimental preset.
  CLANG_SOURCE: "${{ inputs.clang_profile == 'proton-clang' && 'https://github.com/kdrag0n/proton-clang.git' || 'https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git' }}"
  CLANG_BRANCH: "${{ inputs.clang_profile == 'proton-clang' && 'master' || 'lineage-20.0' }}"

  GCC_GNU: "false"
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "a11q_open_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: "false"

  # Upstream builder's SUSFS-capable automatic root integration.
  # Its current selector is "bakasu" (BakaSU / ReSukiSU lineage).
  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "${{ inputs.kernelsu_fork }}"
  KERNELSU_METHOD: "${{ inputs.kernelsu_method }}"

  SUSFS_ENABLE: "${{ inputs.susfs_enable == 'enabled' && 'true' || 'false' }}"
  SUSFS_FIXED: "false"
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""
  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  # Use the device-configured AnyKernel3 repository directly; do not patch it here.
  AK3_SOURCE: "https://github.com/Kazera62/AnyKernel3.git"
  AK3_BRANCH: "master"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "${{ inputs.pack_kmodules == 'enabled' && 'true' || 'false' }}"

  BOOT_SOURCE: ""
  NEED_DTBO: "${{ inputs.need_dtbo == 'enabled' && 'true' || 'false' }}"
  NEED_SAFE_DTBO: "${{ inputs.need_safe_dtbo == 'enabled' && 'true' || 'false' }}"
  GENERATE_DTB: "${{ inputs.generate_dtb == 'enabled' && 'true' || 'false' }}"
  GENERATE_CHIP: "qcom"

  ROM_TEXT: "nocturne_sdm450"
  PYTHON_VERSION: "3"
  HOOK_METHOD: "${{ inputs.hook_method }}"

  REKERNEL_ENABLE: "${{ inputs.rekernel_enable == 'enabled' && 'true' || 'false' }}"
  DROIDSPACES_ENABLE: "${{ inputs.droidspaces_enable == 'enabled' && 'true' || 'false' }}"
  NOMOUNT_ENABLE: "${{ inputs.nomount_enable == 'enabled' && 'true' || 'false' }}"

  KPM_ENABLE: "${{ inputs.kpm_enable == 'enabled' && 'true' || 'false' }}"
  KPM_INLINE: "${{ inputs.kpm_inline == 'enabled' && 'true' || 'false' }}"
  KPM_KPATCH_NEXT: "${{ inputs.kpm_kpatch_next == 'enabled' && 'true' || 'false' }}"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "${{ inputs.baseband_guard_enable == 'enabled' && 'true' || 'false' }}"
  BASEBAND_GUARD_BOOT: "${{ inputs.baseband_guard_boot == 'enabled' && 'true' || 'false' }}"

  BUILD_DEBUGGER: "${{ inputs.patch_diagnostics == 'enabled' && 'true' || 'false' }}"
  SKIP_PATCH: "${{ inputs.skip_patch == 'enabled' && 'true' || 'false' }}"

  BUILD_OTHER_CONFIG: "${{ inputs.merge_config_files != '' && 'true' || 'false' }}"
  MERGE_CONFIG_FILES: "${{ inputs.merge_config_files }}"

  FREE_MORE_SPACE: "${{ inputs.free_more_space == 'enabled' && 'true' || 'false' }}"

jobs:
  build:
    name: Samsung Galaxy M11 / A11 (SDM450)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout upstream NonGKI build framework
        uses: actions/checkout@v6
        with:
          repository: JackA1ltman/NonGKI_Kernel_Build_2nd
          ref: mainline
          persist-credentials: false

      - name: Prepare build environment
        uses: ./.github/workflows/build-env

      - name: Fetch toolchains and build dependencies
        uses: ./.github/workflows/build-ready

      - name: Apply SUSFS kernel patches
        uses: ./.github/workflows/patch-susfs

      - name: Apply no-kprobe compatibility patch
        uses: ./.github/workflows/patch-no-kprobe

      - name: Device-specific build validation
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          echo "Target: Samsung Galaxy M11 / A11 (SDM450)"
          echo "Defconfig: $DEFCONFIG_NAME"
          echo "KernelSU fork: $KERNELSU_AUTO_FORK"
          echo "KernelSU method: $KERNELSU_METHOD"
          echo "SUSFS: $SUSFS_ENABLE"
          echo "Clang profile: ${{ inputs.clang_profile }}"
          echo "Re:Kernel: $REKERNEL_ENABLE | Droidspaces: $DROIDSPACES_ENABLE | NoMount: $NOMOUNT_ENABLE"
          echo "KPM: $KPM_ENABLE | modules: $PACK_KMODULES | free space: $FREE_MORE_SPACE"
          echo "Upstream builder: $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          test -f "arch/arm64/configs/$DEFCONFIG_NAME"

          if [[ "$SUSFS_ENABLE" == "true" && "$KERNELSU_AUTO_FORK" != "bakasu" && "$KERNELSU_AUTO_FORK" != "sukisu" ]]; then
            echo "::error::The upstream framework supports SUSFS with bakasu or sukisu only. Select one of those forks or disable SUSFS."
            exit 1
          fi
          if [[ "$KPM_INLINE" == "true" && ( "$KPM_ENABLE" != "true" || "$KERNELSU_AUTO_FORK" != "sukisu" ) ]]; then
            echo "::error::Inline KPM requires KPM enabled and the sukisu (SukiSU-Ultra) fork."
            exit 1
          fi
          if [[ "$KPM_KPATCH_NEXT" == "true" && "$KPM_ENABLE" != "true" ]]; then
            echo "::error::KPatch-Next requires KPM enabled."
            exit 1
          fi
          if [[ "$BASEBAND_GUARD_BOOT" == "true" && "$BASEBAND_GUARD_ENABLE" != "true" ]]; then
            echo "::error::Boot partition protection requires Baseband Guard enabled."
            exit 1
          fi
          if [[ -n "$MERGE_CONFIG_FILES" ]]; then
            IFS=',' read -ra CONFIG_LIST <<< "$MERGE_CONFIG_FILES"
            for config in "${CONFIG_LIST[@]}"; do
              test -f "arch/arm64/configs/$config" || { echo "::error::Config file not found: arch/arm64/configs/$config"; exit 1; }
            done
          fi
      - name: Optional Re-Kernel patches
        uses: ./.github/workflows/patch-rekernel

      - name: Optional Droidspaces patches
        uses: ./.github/workflows/patch-droidspaces

      - name: Optional Baseband Guard patches
        uses: ./.github/workflows/patch-baseband-guard

      - name: Optional NoMount patches
        uses: ./.github/workflows/patch-nomount

      - name: Compile kernel
        uses: ./.github/workflows/build-process

      - name: Package flashable AnyKernel3 ZIP
        uses: ./.github/workflows/pack-process

      - name: Upload build artifact
        uses: ./.github/workflows/upload-files

      - name: Send kernel ZIP to Telegram
        if: ${{ inputs.telegram_delivery == 'send' }}
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLANG_PROFILE: ${{ inputs.clang_profile }}
        run: |
          set -euo pipefail

          : "${TELEGRAM_BOT_TOKEN:?Add TELEGRAM_BOT_TOKEN under Settings > Secrets and variables > Actions}"
          : "${TELEGRAM_CHAT_ID:?Add TELEGRAM_CHAT_ID under Settings > Secrets and variables > Actions}"
          : "${PACK_NAME:?The upstream pack step did not export PACK_NAME}"

          ZIP_PATH="$GITHUB_WORKSPACE/device_kernel/$PACK_NAME"
          test -s "$ZIP_PATH" || {
            echo "::error::Expected AnyKernel3 ZIP not found: $ZIP_PATH"
            exit 1
          }

          printf -v CAPTION 'NOCTURNE // SDM450\nReSukiSU + SUSFS\nDefconfig: %s\nClang: %s\nCommit: %.7s' \
            "$DEFCONFIG_NAME" "$CLANG_PROFILE" "$GITHUB_SHA"

          RESPONSE="$(curl --fail-with-body --silent --show-error --retry 2 --max-time 300 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "caption=$CAPTION" \
            --form "document=@${ZIP_PATH};type=application/zip")"

          printf '%s' "$RESPONSE" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          if not data.get("ok"):
              print("Telegram upload failed: " + str(data.get("description", "unknown API error")), file=sys.stderr)
              sys.exit(1)
          print("Telegram accepted the kernel ZIP.")
          '

