name: NOCTURNE // SDM450 Kernel Build
run-name: "${{ inputs.kernel_name }} | ${{ inputs.clang_profile }} | ${{ inputs.root_mode }}"

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Nama kernel; hanya huruf, angka, titik, underscore, dan tanda minus"
        required: true
        type: string
        default: NOCTURNE
      clang_profile:
        description: "Pilih compiler Clang"
        required: true
        type: choice
        default: lineage-r416183b
        options:
          - lineage-r416183b
          - proton-clang
      root_mode:
        description: "Pilih root biasa tanpa SUSFS atau root dengan SUSFS"
        required: true
        type: choice
        default: root-susfs
        options:
          - root-no-susfs
          - root-susfs

permissions:
  contents: read

concurrency:
  group: nocturne-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE_NAME: "samsung_m11"
  DEVICE_CODENAME: "m11q"

  KERNEL_NAME: "${{ inputs.kernel_name }}"
  ROOT_MODE: "${{ inputs.root_mode }}"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib64 DTC_EXT=$GITHUB_WORKSPACE/device_kernel/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y LOCALVERSION=-$KERNEL_NAME"

  KERNEL_SOURCE: "https://github.com/Kazera62/samsung_M11_sdm450.git"
  KERNEL_BRANCH: "${{ github.ref_name }}"

  CLANG_SOURCE: "${{ inputs.clang_profile == 'proton-clang' && 'https://github.com/kdrag0n/proton-clang.git' || 'https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git' }}"
  CLANG_BRANCH: "${{ inputs.clang_profile == 'proton-clang' && 'master' || 'lineage-20.0' }}"

  GCC_GNU: "false"
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "a11q_open_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: "false"

  # Both root choices use the upstream BakaSU/ReSukiSU-lineage integration.
  # The selected mode controls whether SUSFS is applied.
  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "bakasu"
  KERNELSU_METHOD: "shell"
  SUSFS_ENABLE: "${{ inputs.root_mode == 'root-susfs' && 'true' || 'false' }}"
  SUSFS_FIXED: "false"
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""
  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  AK3_SOURCE: "https://github.com/Kazera62/AnyKernel3.git"
  AK3_BRANCH: "master"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  BOOT_SOURCE: ""
  NEED_DTBO: "false"
  NEED_SAFE_DTBO: "false"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  ROM_TEXT: "${{ inputs.kernel_name }}"
  PYTHON_VERSION: "3"
  HOOK_METHOD: "syscall"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  # Keep diagnostics on and do not continue silently after rejected SUSFS hunks.
  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""
  FREE_MORE_SPACE: "true"

jobs:
  build:
    name: Samsung Galaxy M11 / A11 (SDM450)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout upstream build framework
        uses: actions/checkout@v6
        with:
          repository: JackA1ltman/NonGKI_Kernel_Build_2nd
          ref: mainline
          persist-credentials: false

      - name: Validate kernel name
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$KERNEL_NAME" =~ ^[A-Za-z0-9._-]{1,32}$ ]]; then
            echo "::error::Invalid kernel name. Use 1-32 letters, numbers, dots, underscores, or hyphens."
            exit 1
          fi
          echo "Kernel name: $KERNEL_NAME"
          echo "Root mode: $ROOT_MODE"
          echo "SUSFS: $SUSFS_ENABLE"
          echo "Defconfig: $DEFCONFIG_NAME"

      - name: Prepare build environment
        uses: ./.github/workflows/build-env

      - name: Fetch toolchains and build dependencies
        uses: ./.github/workflows/build-ready

      - name: Apply SUSFS kernel patches
        uses: ./.github/workflows/patch-susfs

      - name: Apply no-kprobe compatibility patch
        uses: ./.github/workflows/patch-no-kprobe

      - name: Compile kernel
        uses: ./.github/workflows/build-process

      - name: Package flashable AnyKernel3 ZIP
        uses: ./.github/workflows/pack-process

      - name: Upload build artifact
        uses: ./.github/workflows/upload-files

      - name: Send kernel ZIP to Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLANG_PROFILE: ${{ inputs.clang_profile }}
        run: |
          set -euo pipefail

          : "${TELEGRAM_BOT_TOKEN:?Add TELEGRAM_BOT_TOKEN under Settings > Secrets and variables > Actions}"
          : "${TELEGRAM_CHAT_ID:?Add TELEGRAM_CHAT_ID under Settings > Secrets and variables > Actions}"
          : "${PACK_NAME:?The upstream pack step did not export PACK_NAME}"

          ZIP_PATH="$GITHUB_WORKSPACE/device_kernel/$PACK_NAME"
          test -s "$ZIP_PATH" || {
            echo "::error::Expected AnyKernel3 ZIP not found: $ZIP_PATH"
            exit 1
          }

          printf -v CAPTION 'NOCTURNE // SDM450\nKernel: %s\nRoot: %s\nDefconfig: %s\nClang: %s\nCommit: %.7s' \
            "$KERNEL_NAME" "$ROOT_MODE" "$DEFCONFIG_NAME" "$CLANG_PROFILE" "$GITHUB_SHA"

          RESPONSE="$(curl --fail-with-body --silent --show-error --retry 2 --max-time 300 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "caption=$CAPTION" \
            --form "document=@${ZIP_PATH};type=application/zip")"

          printf '%s' "$RESPONSE" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          if not data.get("ok"):
              print("Telegram upload failed: " + str(data.get("description", "unknown API error")), file=sys.stderr)
              sys.exit(1)
          print("Telegram accepted the kernel ZIP.")
          '
