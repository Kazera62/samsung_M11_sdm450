name: NOCTURNE SDM450 Build
run-name: "${{ inputs.kernel_name }} | ${{ inputs.clang_profile }} | ${{ inputs.root }}"

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Custom kernel name"
        required: true
        type: string
        default: NOCTURNE
      clang_profile:
        description: "Compiler toolchain"
        required: true
        type: choice
        default: Clang r416183b
        options:
          - Clang r416183b
          - Proton Clang
      root:
        description: "Root implementation"
        required: true
        type: choice
        default: ReSukiSU (tanpa SUSFS)
        options:
          - Non-root
          - ReSukiSU (tanpa SUSFS)
          - ReSukiSU + SUSFS

permissions:
  contents: read

env:
  DEVICE_NAME: "samsung_m11"
  DEVICE_CODENAME: "m11q"

  KERNEL_NAME: "${{ inputs.kernel_name }}"
  # The workflow's selected Git ref is also the kernel source branch.
  KERNEL_BRANCH: "${{ github.ref_name }}"
  ROOT_NAME: "${{ inputs.root }}"

  # Required for this kernel's Samsung DTB and overlay generation.
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib64 DTC_EXT=$GITHUB_WORKSPACE/device_kernel/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y LOCALVERSION=-$KERNEL_NAME"

  KERNEL_SOURCE: "https://github.com/Kazera62/samsung_M11_sdm450.git"

  CLANG_SOURCE: "${{ inputs.clang_profile == 'Proton Clang' && 'https://github.com/kdrag0n/proton-clang.git' || 'https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git' }}"
  CLANG_BRANCH: "${{ inputs.clang_profile == 'Proton Clang' && 'master' || 'lineage-20.0' }}"

  GCC_GNU: "false"
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  DEFCONFIG_NAME: "a11q_open_defconfig"

  # ReSukiSU uses the setup script and manual hooks on this Linux 4.9 Non-GKI kernel.
  KERNELSU_AUTO_GET: "${{ inputs.root == 'Non-root' && 'true' || 'false' }}"
  KERNELSU_SOURCE: "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh"
  # SUSFS builds use the last BakaSU revision before upstream suspended SUSFS integration.
  KERNELSU_BRANCH: "${{ inputs.root == 'ReSukiSU + SUSFS' && 'fdd18805bdac7d05aec4db2ef7a4a548037e3857' || 'main' }}"
  KERNELSU_METHOD: "shell"
  # SUSFS is disabled until its Linux 4.9 backport is validated.
  SUSFS_ENABLE: "${{ inputs.root == 'ReSukiSU + SUSFS' && 'true' || 'false' }}"
  SUSFS_FIXED: "false"
  SUSFS_PATCH_FIXED: "${{ inputs.root == 'ReSukiSU + SUSFS' && 'nocturne_susfs_49fix' || '' }}"
  SUSFS_FOLDER_FIXED: ""

  # Always use the user's own AnyKernel3 repository.
  AK3_SOURCE: "https://github.com/Kazera62/AnyKernel3.git"
  AK3_BRANCH: "master"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"
  ROM_TEXT: "${{ inputs.kernel_name }}"
  PYTHON_VERSION: "3"
  HOOK_METHOD: "syscall"

  BUILD_DEBUGGER: "true"
  FREE_MORE_SPACE: "true"

jobs:
  build:
    name: Samsung Galaxy M11 / A11 (SDM450)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Validate build inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$KERNEL_NAME" =~ ^[A-Za-z0-9._-]{1,32}$ ]]; then
            echo "::error::Kernel name must be 1-32 characters: letters, digits, dot, underscore, or hyphen."
            exit 1
          fi
          if ! git check-ref-format --branch "$KERNEL_BRANCH" >/dev/null 2>&1; then
            echo "::error::The selected workflow ref is not a valid kernel branch: $KERNEL_BRANCH"
            exit 1
          fi
          printf 'Kernel: %s\nBranch: %s\nRoot: %s\n' \
            "$KERNEL_NAME" "$KERNEL_BRANCH" "$ROOT_NAME"

      - name: Checkout NonGKI build framework
        uses: actions/checkout@v6
        with:
          repository: JackA1ltman/NonGKI_Kernel_Build_2nd
          # Follow upstream mainline so framework updates are used on each run.
          ref: mainline
          persist-credentials: false
          fetch-depth: 1

      - name: Tune upstream actions for this kernel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label}, found {count}.")
              return source.replace(old, new, 1)

          ready_path = Path(".github/workflows/build-ready/action.yml")
          ready = ready_path.read_text()

          # Rootless builds must not install KernelSU.
          old_ksu = "\n".join([
              "      - name: Set KernelSU",
              "        shell: bash",
              "",
          ])
          new_ksu = "\n".join([
              "      - name: Set KernelSU",
              "        if: env.ROOT_NAME != 'Non-root'",
              "        shell: bash",
              "",
          ])
          ready = replace_once(ready, old_ksu, new_ksu, "KernelSU setup step")

          # Strip the unrelated fork-only patch stage by its patch filename marker.
          parts = re.split(r'(?m)(?=^      - name: )', ready)
          patch_steps = [part for part in parts if "fixed.patch" in part]
          if len(patch_steps) != 1:
              raise SystemExit(f"Expected one unrelated fixed patch step, found {len(patch_steps)}.")
          ready = "".join(part for part in parts if "fixed.patch" not in part)

          # Do not append KSU configuration for Non-root builds.
          old_config = "\n".join([
              "      - name: Set KSU and SUSFS for DEFCONFIG",
              "        shell: bash",
              "",
          ])
          new_config = "\n".join([
              "      - name: Set KSU and SUSFS for DEFCONFIG",
              "        if: env.ROOT_NAME != 'Non-root'",
              "        shell: bash",
              "",
          ])
          ready = replace_once(ready, old_config, new_config, "root config step")
          ready_path.write_text(ready)

          # The optional SUSFS hunks below target APIs not present in this Samsung
          # Linux 4.9 tree. Retain the core path/mount feature set for this build.
          susfs_action_path = Path(".github/workflows/patch-susfs/action.yml")
          susfs_action = susfs_action_path.read_text()
          for feature in (
              "SUS_KSTAT",
              "SPOOF_CMDLINE_OR_BOOTCONFIG",
              "OPEN_REDIRECT",
              "SUS_MAP",
          ):
              pattern = re.compile(
                  rf'(?m)^ *echo "CONFIG_KSU_SUSFS_{feature}=y" >> .*$'
              )
              susfs_action, count = pattern.subn("", susfs_action)
              if count != 1:
                  raise SystemExit(
                      f"Expected one optional SUSFS config line for {feature}, found {count}."
                  )
          susfs_action_path.write_text(susfs_action)

          # Keep runner setup lighter: skip optional package purging and compilation
          # of Coccinelle, which is not used by this build path.
          env_path = Path(".github/workflows/build-env/action.yml")
          env_text = env_path.read_text()
          env_text = replace_once(
              env_text,
              "large-packages: true",
              "large-packages: false",
              "large package cleanup option",
          )

          expression_prefix = "$" + "{{"
          newer_marker = 'elif [ "' + expression_prefix + ' env.SYSTEM_VERSION }}" == "newer" ]; then'
          arch_marker = 'elif [ "' + expression_prefix + ' env.SYSTEM_VERSION }}" == "arch" ]; then'
          section_start = env_text.index(newer_marker)
          section_end = env_text.index(arch_marker, section_start)
          newer_section = env_text[section_start:section_end]
          coccinelle_start = newer_section.index("            # Install Coccinelle\n")
          coccinelle_end = newer_section.index("            # Install Libtinfo5\n", coccinelle_start)
          newer_section = (
              newer_section[:coccinelle_start]
              + "            # Coccinelle is not used by this kernel build path; skip building it.\n\n"
              + newer_section[coccinelle_end:]
          )
          env_text = env_text[:section_start] + newer_section + env_text[section_end:]
          env_path.write_text(env_text)
          print("Framework tuned for this kernel; rootless setup and unrelated patch steps are skipped.")
          PY

      - name: Prepare build environment
        uses: ./.github/workflows/build-env

      - name: Fetch toolchains and kernel source
        uses: ./.github/workflows/build-ready

      - name: Ensure Non-root build has no root integration
        if: inputs.root == 'Non-root'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"

          # Defense in depth: remove any residual KSU source/config wiring
          # before kernel configuration, so Non-root output contains no KSU.
          rm -rf drivers/kernelsu KernelSU KernelSU-Next

          sed -i -E \
            '/^[[:space:]]*obj-\$\(CONFIG_KSU\)[[:space:]]*\+=[[:space:]]*kernelsu\/[[:space:]]*$/d' \
            drivers/Makefile
          sed -i -E \
            '/^[[:space:]]*source[[:space:]]+"drivers\/kernelsu\/Kconfig"[[:space:]]*$/d' \
            drivers/Kconfig

          config="arch/arm64/configs/$DEFCONFIG_NAME"
          sed -i -E '/^(# )?CONFIG_KSU(_[A-Z0-9_]+)?(=| is not set$)/d' "$config"

          if grep -nE 'drivers/kernelsu|CONFIG_KSU|KernelSU' \
            drivers/Makefile drivers/Kconfig "$config"; then
            echo "::error::KernelSU references remain in the Non-root build configuration."
            exit 1
          fi

          echo "Non-root cleanup passed: no KernelSU integration remains."

      - name: Configure ReSukiSU manual hooks
        if: inputs.root == 'ReSukiSU (tanpa SUSFS)'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"

          config="arch/arm64/configs/$DEFCONFIG_NAME"
          test -s "$config" || {
            echo "::error::Defconfig not found: $config"
            exit 1
          }

          # Remove duplicate / stale KSU entries, then enable root with manual hooks only.
          sed -i -E '/^(# )?CONFIG_KSU([A-Z0-9_]+)?(=| is not set$)/d' "$config"
          cat >> "$config" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          EOF

          grep -qx 'CONFIG_KSU=y' "$config"
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' "$config"
          if grep -qE '^(# )?CONFIG_KSU_SUSFS(_[A-Z0-9_]+)?(=| is not set$)' "$config"; then
            echo "::error::SUSFS settings remain in the root defconfig."
            exit 1
          fi

          echo "ReSukiSU manual hooks enabled; SUSFS remains disabled."

      - name: Use Kazera62 AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          installer="$GITHUB_WORKSPACE/device_kernel/AnyKernel3"

          # The framework already clones AK3_SOURCE for this configuration.
          # Only replace it if the checked-out origin is not the user's repository.
          remote=""
          if [[ -d "$installer/.git" ]]; then
            remote="$(git -C "$installer" remote get-url origin 2>/dev/null || true)"
          fi
          if [[ "${remote%.git}" != "${AK3_SOURCE%.git}" ]]; then
            rm -rf "$installer"
            git clone --depth=1 --branch "$AK3_BRANCH" "$AK3_SOURCE" "$installer"
          fi

          test -s "$installer/anykernel.sh" || {
            echo "::error::AnyKernel3 repository is missing anykernel.sh."
            exit 1
          }

          printf 'AnyKernel3 source: %s (%s)\n' "$AK3_SOURCE" "$AK3_BRANCH"

      - name: Apply KernelSU hook patch
        if: inputs.root == 'ReSukiSU (tanpa SUSFS)'
        uses: ./.github/workflows/patch-no-kprobe

      - name: Apply SUSFS patch for Samsung Linux 4.9
        if: inputs.root == 'ReSukiSU + SUSFS'
        uses: ./.github/workflows/patch-susfs

      - name: Validate SUSFS integration
        if: inputs.root == 'ReSukiSU + SUSFS'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"

          config="arch/arm64/configs/$DEFCONFIG_NAME"
          test -s "$config" || {
            echo "::error::SUSFS defconfig is missing."
            exit 1
          }
          test -s fs/susfs.c || {
            echo "::error::The SUSFS core source fs/susfs.c was not installed."
            exit 1
          }
          test -s include/linux/susfs.h || {
            echo "::error::The SUSFS public header is missing."
            exit 1
          }
          grep -q 'susfs_is_current_ksu_domain' fs/namespace.c || {
            echo "::error::SUSFS mount implementation did not apply."
            exit 1
          }
          grep -q '#include <linux/susfs_def.h>' fs/namespace.c || {
            echo "::error::Samsung Linux 4.9 SUSFS compatibility hunk did not apply."
            exit 1
          }
          grep -q 'CL_COPY_MNT_NS BIT(25)' fs/namespace.c || {
            echo "::error::SUSFS mount namespace flag is missing."
            exit 1
          }

          # Explicitly disable SUSFS options whose kernel-API hunks are not ported.
          sed -i -E '/^(# )?CONFIG_KSU_SUSFS_SUS_KSTAT(=| is not set$)/d' "$config"
          sed -i -E '/^(# )?CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG(=| is not set$)/d' "$config"
          sed -i -E '/^(# )?CONFIG_KSU_SUSFS_OPEN_REDIRECT(=| is not set$)/d' "$config"
          sed -i -E '/^(# )?CONFIG_KSU_SUSFS_SUS_MAP(=| is not set$)/d' "$config"
          sed -i -E '/^(# )?CONFIG_KSU_MANUAL_HOOK(=| is not set$)/d' "$config"
          cat >> "$config" <<'EOF'
          # CONFIG_KSU_SUSFS_SUS_KSTAT is not set
          # CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG is not set
          # CONFIG_KSU_SUSFS_OPEN_REDIRECT is not set
          # CONFIG_KSU_SUSFS_SUS_MAP is not set
          # CONFIG_KSU_MANUAL_HOOK is not set
          EOF

          for symbol in CONFIG_KSU=y CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_SUS_PATH=y CONFIG_KSU_SUSFS_SUS_MOUNT=y; do
            grep -qx "$symbol" "$config" || {
              echo "::error::Required SUSFS config missing: $symbol"
              exit 1
            }
          done
          if grep -qE '^CONFIG_KSU_SUSFS_(SUS_KSTAT|SPOOF_CMDLINE_OR_BOOTCONFIG|OPEN_REDIRECT|SUS_MAP)=y$' "$config"; then
            echo "::error::An unported optional SUSFS feature was enabled."
            exit 1
          fi
          if grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$config"; then
            echo "::error::Manual hooks conflict with SUSFS inline hooks."
            exit 1
          fi
          if find . -type f -name '*.rej' -print -quit | grep -q .; then
            echo "::error::Unresolved patch rejected hunks remain in the source tree."
            exit 1
          fi

          echo "SUSFS core validated: path/mount hiding enabled; unported optional features disabled."

      - name: Compile kernel
        uses: ./.github/workflows/build-process

      - name: Validate kernel image and DTB output
        shell: bash
        run: |
          set -euo pipefail

          boot_dir="$GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot"
          image_gz="$boot_dir/Image.gz"
          image_gz_dtb="$boot_dir/Image.gz-dtb"
          dtb_dir="$boot_dir/dts/samsung"

          test -s "$image_gz" || {
            echo "::error::Image.gz was not generated."
            exit 1
          }
          test -s "$image_gz_dtb" || {
            echo "::error::Image.gz-dtb was not generated. Packaging stopped."
            exit 1
          }
          test -d "$dtb_dir" || {
            echo "::error::Samsung DTB output directory is missing: $dtb_dir"
            exit 1
          }

          dtb_count="$(find "$dtb_dir" -maxdepth 1 -type f -name '*.dtb' | wc -l)"
          if [[ "$dtb_count" -eq 0 ]]; then
            echo "::error::No Samsung DTB files were generated. Check DTC_EXT and CONFIG_BUILD_ARM64_DT_OVERLAY."
            exit 1
          fi
          if cmp -s "$image_gz" "$image_gz_dtb"; then
            echo "::error::Image.gz-dtb matches Image.gz byte-for-byte; DTB concatenation likely failed."
            exit 1
          fi

          printf 'Image.gz: %s bytes\n' "$(stat -c %s "$image_gz")"
          printf 'Image.gz-dtb: %s bytes\n' "$(stat -c %s "$image_gz_dtb")"
          printf 'Samsung DTB count: %s\n' "$dtb_count"

      - name: Package AnyKernel3 ZIP
        uses: ./.github/workflows/pack-process

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          : "${PACK_NAME:?Packaging did not export PACK_NAME}"

          zip_path="$GITHUB_WORKSPACE/device_kernel/$PACK_NAME"
          test -s "$zip_path" || {
            echo "::error::AnyKernel3 ZIP was not found: $zip_path"
            exit 1
          }

          unzip -tq "$zip_path"
          unzip -Z1 "$zip_path" | grep -Fxq 'Image.gz-dtb' || {
            echo "::error::ZIP does not contain Image.gz-dtb."
            exit 1
          }

          echo "Package validation passed: $PACK_NAME"

      - name: Upload ZIP artifact
        uses: ./.github/workflows/upload-files

      - name: Send ZIP to Telegram (optional)
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLANG_PROFILE: ${{ inputs.clang_profile }}
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::notice::Telegram secrets are not configured; the GitHub Actions artifact is available instead."
            exit 0
          fi

          : "${PACK_NAME:?Packaging did not export PACK_NAME}"
          zip_path="$GITHUB_WORKSPACE/device_kernel/$PACK_NAME"
          test -s "$zip_path"

          printf -v caption 'NOCTURNE // SDM450\nKernel: %s\nBranch: %s\nRoot: %s\nDefconfig: %s\nClang: %s\nCommit: %.7s' \
            "$KERNEL_NAME" "$KERNEL_BRANCH" "$ROOT_NAME" "$DEFCONFIG_NAME" "$CLANG_PROFILE" "$GITHUB_SHA"

          response="$(curl --fail-with-body --silent --show-error --retry 2 --max-time 300 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "caption=$caption" \
            --form "document=@${zip_path};type=application/zip")"

          printf '%s' "$response" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          if not data.get("ok"):
              print("Telegram upload failed: " + str(data.get("description", "unknown API error")), file=sys.stderr)
              sys.exit(1)
          print("Telegram accepted the kernel ZIP.")
          '
