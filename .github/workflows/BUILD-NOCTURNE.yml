name: NOCTURNE // SDM450 Kernel Build
run-name: "NOCTURNE | M11/A11 | ReSukiSU + SUSFS"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nocturne-build-${{ github.ref }}
  cancel-in-progress: true

# This workflow consumes the latest mainline build framework on every run.
# Kernel source is cloned from the branch selected in the Actions UI.
env:
  DEVICE_NAME: "samsung_m11"
  DEVICE_CODENAME: "m11q"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib64 DTC_EXT=$GITHUB_WORKSPACE/device_kernel/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y"

  KERNEL_SOURCE: "https://github.com/Kazera62/samsung_M11_sdm450.git"
  KERNEL_BRANCH: "${{ github.ref_name }}"

  # Toolchains based on the working Linux 4.9 example in the upstream builder.
  CLANG_SOURCE: "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH: "lineage-20.0"

  GCC_GNU: "false"
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "a11q_open_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: "false"

  # Upstream builder's SUSFS-capable ReSukiSU/BakaSU integration route.
  # The upstream template identifies this selection as "bakasu".
  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "bakasu"
  KERNELSU_METHOD: "shell"

  SUSFS_ENABLE: "true"
  # Use the upstream generic kernel-version patch first; no device-specific
  # fixed patch currently exists in this repository for the M11/SDM450 tree.
  SUSFS_FIXED: "false"
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""
  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  BOOT_SOURCE: ""
  NEED_DTBO: "false"
  NEED_SAFE_DTBO: "false"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  ROM_TEXT: "nocturne_sdm450"
  PYTHON_VERSION: "3"
  HOOK_METHOD: "syscall"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true"

jobs:
  build:
    name: Samsung Galaxy M11 / A11 (SDM450)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout upstream NonGKI build framework
        uses: actions/checkout@v6
        with:
          repository: JackA1ltman/NonGKI_Kernel_Build_2nd
          ref: mainline
          path: NonGKI_Kernel_Build_2nd
          persist-credentials: false

      - name: Prepare build environment
        uses: ./NonGKI_Kernel_Build_2nd/.github/workflows/build-env

      - name: Fetch toolchains and build dependencies
        uses: ./NonGKI_Kernel_Build_2nd/.github/workflows/build-ready

      - name: Apply SUSFS kernel patches
        uses: ./NonGKI_Kernel_Build_2nd/.github/workflows/patch-susfs

      - name: Apply no-kprobe compatibility patch
        uses: ./NonGKI_Kernel_Build_2nd/.github/workflows/patch-no-kprobe

      - name: Device-specific build adjustments
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          echo "Target: Samsung Galaxy M11 / A11 (SDM450)"
          echo "Defconfig: $DEFCONFIG_NAME"
          echo "KernelSU selector: $KERNELSU_AUTO_FORK"
          echo "SUSFS: $SUSFS_ENABLE"
          echo "Upstream builder: $(git -C "$GITHUB_WORKSPACE/NonGKI_Kernel_Build_2nd" rev-parse --short HEAD)"
          test -f "arch/arm64/configs/$DEFCONFIG_NAME"

      - name: Optional Re-Kernel patches
        uses: ./NonGKI_Kernel_Build_2nd/.github/workflows/patch-rekernel

      - name: Optional Droidspaces patches
        uses: ./NonGKI_Kernel_Build_2nd/.github/workflows/patch-droidspaces

      - name: Optional Baseband Guard patches
        uses: ./NonGKI_Kernel_Build_2nd/.github/workflows/patch-baseband-guard

      - name: Optional NoMount patches
        uses: ./NonGKI_Kernel_Build_2nd/.github/workflows/patch-nomount

      - name: Compile kernel
        uses: ./NonGKI_Kernel_Build_2nd/.github/workflows/build-process

      - name: Package flashable kernel ZIP
        uses: ./NonGKI_Kernel_Build_2nd/.github/workflows/pack-process

      - name: Upload build artifact
        uses: ./NonGKI_Kernel_Build_2nd/.github/workflows/upload-files
