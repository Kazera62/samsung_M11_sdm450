name: NOCTURNE SDM450 Build
run-name: "${{ inputs.kernel_name }} | ${{ inputs.clang_profile }} | ${{ inputs.root }}"

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Nama kernel"
        required: true
        type: string
        default: NOCTURNE
      clang_profile:
        description: "Compiler Clang"
        required: true
        type: choice
        default: Clang r416183b
        options:
          - Clang r416183b
          - Proton Clang
      root:
        description: "Root dengan SUSFS"
        required: true
        type: choice
        default: ReSukiSU + SUSFS
        options:
          - ReSukiSU + SUSFS
          - SukiSU-Ultra + SUSFS

permissions:
  contents: read

env:
  DEVICE_NAME: "samsung_m11"
  DEVICE_CODENAME: "m11q"

  KERNEL_NAME: "${{ inputs.kernel_name }}"
  ROOT_NAME: "${{ inputs.root }}"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib64 DTC_EXT=$GITHUB_WORKSPACE/device_kernel/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y LOCALVERSION=-$KERNEL_NAME"

  KERNEL_SOURCE: "https://github.com/Kazera62/samsung_M11_sdm450.git"
  KERNEL_BRANCH: "${{ github.ref_name }}"

  CLANG_SOURCE: "${{ inputs.clang_profile == 'Proton Clang' && 'https://github.com/kdrag0n/proton-clang.git' || 'https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git' }}"
  CLANG_BRANCH: "${{ inputs.clang_profile == 'Proton Clang' && 'master' || 'lineage-20.0' }}"

  GCC_GNU: "false"
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  DEFCONFIG_NAME: "a11q_open_defconfig"

  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "${{ inputs.root == 'SukiSU-Ultra + SUSFS' && 'sukisu' || 'bakasu' }}"
  KERNELSU_METHOD: "shell"
  SUSFS_ENABLE: "true"
  SUSFS_FIXED: "false"

  AK3_SOURCE: "https://github.com/Kazera62/AnyKernel3.git"
  AK3_BRANCH: "master"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"
  ROM_TEXT: "${{ inputs.kernel_name }}"
  PYTHON_VERSION: "3"
  HOOK_METHOD: "syscall"

  BUILD_DEBUGGER: "true"
  # The upstream SUSFS action's reject handler is inverted; validate its archive below.
  SKIP_PATCH: "true"

  FREE_MORE_SPACE: "true"

jobs:
  build:
    name: Samsung M11 / A11
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Validate kernel name
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$KERNEL_NAME" =~ ^[A-Za-z0-9._-]{1,32}$ ]]; then
            echo "::error::Nama kernel hanya boleh berisi huruf, angka, titik, underscore, dan minus (maksimal 32 karakter)."
            exit 1
          fi
          echo "Kernel: $KERNEL_NAME"
          echo "Root: $ROOT_NAME"

      - name: Checkout build framework
        uses: actions/checkout@v6
        with:
          repository: JackA1ltman/NonGKI_Kernel_Build_2nd
          ref: mainline
          persist-credentials: false

      - name: Prepare environment
        uses: ./.github/workflows/build-env

      - name: Fetch toolchains
        uses: ./.github/workflows/build-ready

      - name: Apply SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: Validate SUSFS patch result
        shell: bash
        run: |
          set -euo pipefail
          reject_archive="$GITHUB_WORKSPACE/device_kernel/rej_files_1.5.5.tar.gz"
          if [[ ! -s "$reject_archive" ]]; then
            echo "::error::SUSFS reject archive was not generated; cannot verify patch integrity."
            exit 1
          fi
          if tar -tzf "$reject_archive" | grep -Eq '\.rej      - name: Apply root hook patch
        uses: ./.github/workflows/patch-no-kprobe

      - name: Build kernel
        uses: ./.github/workflows/build-process

      - name: Validate kernel image and Samsung DTBs
        shell: bash
        run: |
          set -euo pipefail
          boot_dir="$GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot"
          image_gz="$boot_dir/Image.gz"
          image_gz_dtb="$boot_dir/Image.gz-dtb"
          dtb_dir="$boot_dir/dts/samsung"

          test -s "$image_gz" || {
            echo "::error::Image.gz was not generated."
            exit 1
          }
          test -s "$image_gz_dtb" || {
            echo "::error::Image.gz-dtb was not generated. Refusing to package a kernel without its device tree."
            exit 1
          }
          test -d "$dtb_dir" || {
            echo "::error::Samsung DTB output directory is missing: $dtb_dir"
            exit 1
          }

          dtb_count="$(find "$dtb_dir" -maxdepth 1 -type f -name '*.dtb' | wc -l)"
          if [[ "$dtb_count" -eq 0 ]]; then
            echo "::error::No Samsung DTB files were generated. Check DTC_EXT and CONFIG_BUILD_ARM64_DT_OVERLAY."
            exit 1
          fi
          if cmp -s "$image_gz" "$image_gz_dtb"; then
            echo "::error::Image.gz-dtb is byte-identical to Image.gz; DTB concatenation likely failed."
            exit 1
          fi

          printf 'Image.gz: %s bytes\n' "$(stat -c %s "$image_gz")"
          printf 'Image.gz-dtb: %s bytes\n' "$(stat -c %s "$image_gz_dtb")"
          printf 'Samsung DTB files: %s\n' "$dtb_count"

      - name: Package ZIP
        uses: ./.github/workflows/pack-process

      - name: Upload ZIP
        uses: ./.github/workflows/upload-files

      - name: Send ZIP to Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLANG_PROFILE: ${{ inputs.clang_profile }}
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::notice::Telegram secrets are not configured; skipping Telegram upload. The GitHub artifact is still available."
            exit 0
          fi
          : "${PACK_NAME:?The upstream pack step did not export PACK_NAME}"

          ZIP_PATH="$GITHUB_WORKSPACE/device_kernel/$PACK_NAME"
          test -s "$ZIP_PATH" || {
            echo "::error::Expected AnyKernel3 ZIP not found: $ZIP_PATH"
            exit 1
          }

          printf -v CAPTION 'NOCTURNE // SDM450\nKernel: %s\nRoot: %s\nDefconfig: %s\nClang: %s\nCommit: %.7s' \
            "$KERNEL_NAME" "$ROOT_NAME" "$DEFCONFIG_NAME" "$CLANG_PROFILE" "$GITHUB_SHA"

          RESPONSE="$(curl --fail-with-body --silent --show-error --retry 2 --max-time 300 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "caption=$CAPTION" \
            --form "document=@${ZIP_PATH};type=application/zip")"

          printf '%s' "$RESPONSE" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          if not data.get("ok"):
              print("Telegram upload failed: " + str(data.get("description", "unknown API error")), file=sys.stderr)
              sys.exit(1)
          print("Telegram accepted the kernel ZIP.")
          '
; then
            echo "::error::SUSFS patch has rejected hunks. Inspect the patch_rejected_files artifact; build stopped to avoid packaging an incomplete kernel."
            tar -tzf "$reject_archive" | grep -E '\.rej      - name: Apply root hook patch
